[package]
name = "app"
version = "0.2.0"
description = "File flow"
authors = ["Andrew Yurchenko"]
license-file = "license.txt"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
tauri = { version = "2.11.5", features = ["tray-icon"] } # <--- КРИТИЧЕСКИ ВАЖНО
tauri-plugin-log = "2.9.0"
tauri-plugin-dialog = "2.7.2"
walkdir = "2.5.0"
tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }

sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-native-tls", "macros", "chrono"] }
md5 = "0.8.1"
rayon = "1.12.0"
filetime = "0.2.29"
fastembed = "6.0.1"
tauri-plugin-autostart = "2.5.1"
serde_json = "1.0.151"
image = "0.25.10"
pdf-extract = "0.12.0"
zip = "8.6.0"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
pdfium-render = "0.9.3"
tempfile = "3.27.0"
heif-oxide = "0.1.0"
calamine = "0.36.1"
litchi = "0.0.1"
strsim = "0.11.1"
