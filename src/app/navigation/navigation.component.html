@let isHandset = this.isHandset();

<mat-sidenav-container class="sidenav-container">
    <mat-sidenav
        #drawer
        class="sidenav"
        fixedInViewport
        [attr.role]="isHandset ? 'dialog' : 'navigation'"
        [mode]="isHandset ? 'over' : 'side'"
        [opened]="!isHandset"
        autoFocus="false"
    >
        <mat-toolbar style="justify-content: center">Навигация</mat-toolbar>
        <mat-nav-list>
            <!-- 1. Сканер -->
            <mat-list-item
                    routerLink="/scanner"
                    routerLinkActive
                    #rlaScanner="routerLinkActive"
                    [activated]="rlaScanner.isActive"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="isHandset ? drawer.close() : null">
                <mat-icon matListItemIcon>radar</mat-icon>
                <span matListItemTitle>Сканер</span>
            </mat-list-item>

            <!-- 2. Сортировщик -->
            <mat-list-item
                    routerLink="/sorter"
                    routerLinkActive
                    #rlaSorter="routerLinkActive"
                    [activated]="rlaSorter.isActive"
                    (click)="isHandset ? drawer.close() : null">
                <mat-icon matListItemIcon>move_to_inbox</mat-icon>
                <span matListItemTitle>Сортировщик</span>
            </mat-list-item>

            <!-- 2. Умный поиск -->
            <mat-list-item
                    routerLink="/smart-search"
                    routerLinkActive
                    #rlaSmartSearch="routerLinkActive"
                    [activated]="rlaSmartSearch.isActive"
                    (click)="isHandset ? drawer.close() : null">
                <mat-icon matListItemIcon>query_stats</mat-icon>
                <span matListItemTitle>Умный поиск</span>
            </mat-list-item>

            <!-- 3. О программе -->
            <mat-list-item
                    routerLink="/about"
                    routerLinkActive
                    #rlaAbout="routerLinkActive"
                    [activated]="rlaAbout.isActive"
                    (click)="isHandset ? drawer.close() : null">
                <mat-icon matListItemIcon>info</mat-icon>
                <span matListItemTitle>О программе</span>
            </mat-list-item>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
        <mat-toolbar color="primary">
            @if (isHandset) {
                <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
                    <mat-icon>menu</mat-icon>
                </button>
            }
            <span>File Flow</span>

            <span class="spacer" style="flex: 1 1 auto;"></span>

            <!-- Блок управления темой в тулбаре -->
            <div class="theme-control-group">
                <span class="theme-group-title">Тема</span>
                <div class="theme-controls-row">
                    <!-- Тумблер Авто-режима -->
                    <mat-slide-toggle
                            [checked]="themeService.isAutoTheme()"
                            (change)="themeService.setAutoMode($event.checked)">
                        @if (themeService.isAutoTheme()) {
                            <span class="slide-toggle-label">Системная</span>
                        } @else {
                            <span class="slide-toggle-label">Ручная</span>
                        }
                    </mat-slide-toggle>

                    <!-- Кнопка ручного переключения (активна, только если Авто выключен) -->
                    <button
                            mat-icon-button
                            [disabled]="themeService.isAutoTheme()"
                            (click)="themeService.toggleManualTheme()"
                            [matTooltip]="themeService.isAutoTheme() ? 'Включен авто-режим (по системе)' : 'Сменить тему'">
                        <mat-icon>
                            {{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}
                        </mat-icon>
                    </button>
                </div>
            </div>
        </mat-toolbar>
        <!-- Add Content Here -->
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
